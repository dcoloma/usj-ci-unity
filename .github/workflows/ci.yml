name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── 1. Run EditMode tests on local Mac runner ─────────────────────────────
  test:
    name: Run tests
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Run EditMode tests
        run: |
          "/Applications/Unity/Hub/Editor/6000.4.5f1/Unity.app/Contents/MacOS/Unity" \
            -runTests \
            -batchmode \
            -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -testResults "$GITHUB_WORKSPACE/test-results.xml" \
            -testPlatform EditMode \
            -logFile "$GITHUB_WORKSPACE/test.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            test.log

  # ── 2. Build WebGL (only on push to main, after tests pass) ──────────────
  build:
    name: Build WebGL
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build WebGL
        run: |
          "/Applications/Unity/Hub/Editor/6000.4.5f1/Unity.app/Contents/MacOS/Unity" \
            -batchmode \
            -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod BuildScript.Build \
            -logFile "$GITHUB_WORKSPACE/build.log" \
            -quit

      - uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build/

  # ── 3. Deploy to GitHub Pages ─────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webgl-build
          path: build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

      - id: deployment
        uses: actions/deploy-pages@v4
